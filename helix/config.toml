# ── Theme ─────────────────────────────────────────────────────────────

theme = "adwaita-dark"

[editor]

# ── Editor: Appearance ────────────────────────────────────────────────

line-number = "relative"
cursorline = true
bufferline = "multiple"
color-modes = true
popup-border = "all"
scrolloff = 8

# ── Editor: Editing ───────────────────────────────────────────────────

default-yank-register = "+"
trim-trailing-whitespace = true

# ── Editor: Diagnostics ───────────────────────────────────────────────

end-of-line-diagnostics = "hint"

# ── Appearance: Cursor & Status Line ──────────────────────────────────

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control"]
center = ["file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-type"]

# ── Appearance: Whitespace ────────────────────────────────────────────

[editor.indent-guides]
render = true

[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "all"
nnbsp = "all"
newline = "none"

# ── File Picker ───────────────────────────────────────────────────────

[editor.file-picker]
hidden = false
git-ignore = true

# ── Inline Diagnostics ────────────────────────────────────────────────

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"

# ── Keybindings ───────────────────────────────────────────────────────

[keys.normal]
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"

[keys.normal.space]
q = ":quit"
w = ":write"

[keys.insert]
S-tab = "move_parent_node_start"

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
