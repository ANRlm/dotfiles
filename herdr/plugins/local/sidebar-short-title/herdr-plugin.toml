id = "sidebar-short-title"
name = "Sidebar short titles"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Compact sidebar titles, preferring native pane and manual tab aliases. Requires Python 3 and ../metadata_refresh.py."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "short_title.py"]

# shortcut: 0.9.3 has no title-change plugin event; refresh on state/focus until one exists.
[[events]]
on = "pane.created"
command = ["python3", "short_title.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "short_title.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "short_title.py"]

[[events]]
on = "pane.focused"
command = ["python3", "short_title.py"]

[[events]]
on = "tab.focused"
command = ["python3", "short_title.py"]

[[events]]
on = "pane.moved"
command = ["python3", "short_title.py"]

# Delay so herdr-automatic-rename records the manual opt-out first.
[[events]]
on = "tab.renamed"
command = ["sh", "-c", "sleep 1; exec python3 short_title.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "short_title.py"]
