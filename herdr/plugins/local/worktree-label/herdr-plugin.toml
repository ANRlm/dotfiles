id = "worktree-label"
name = "Worktree label"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Expose the linked Git worktree a workspace's agent works in as $worktree and $worktree_status. Requires Python 3, Git 2.31+, and ../metadata_refresh.py."
platforms = ["linux", "macos"]

# Runs for the server's lifetime, refreshing every 20s between events.
[[startup]]
command = ["python3", "worktree_label.py", "--watch"]

[[events]]
on = "pane.created"
command = ["python3", "worktree_label.py"]

# The agent's foreground_cwd moves into its worktree only after launch.
[[events]]
on = "pane.agent_detected"
command = ["python3", "worktree_label.py"]

# No cwd/branch-change event exists; these plus the startup poll cover it.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "worktree_label.py"]

[[events]]
on = "pane.moved"
command = ["python3", "worktree_label.py"]

[[events]]
on = "pane.closed"
command = ["python3", "worktree_label.py"]

[[events]]
on = "workspace.focused"
command = ["python3", "worktree_label.py"]

# Whether the branch is shown depends on the workspace name.
[[events]]
on = "workspace.renamed"
command = ["python3", "worktree_label.py"]
