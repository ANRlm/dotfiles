onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────

[theme]
name = "tokyo-night"
auto_switch = false

# Keep separators visible through the terminal palette, without pinning an RGB color.
[theme.custom]
surface_dim = "darkgray"

# ── UI ────────────────────────────────────────────────────────────────

[ui]
# Sidebar
sidebar_width = 32
sidebar_min_width = 20
sidebar_max_width = 38
sidebar_collapsed_mode = "compact"

# Tabs & window
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
window_title = "{hostname} · {workspace} · {tab}"

# Panes
pane_borders = "auto"
pane_gaps = true
pane_outer_borders = true
show_agent_labels_on_pane_borders = true

# Agents
agent_panel_sort = "spaces"
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "$sidebar_title", fg = "#ffffff", bold = true, dim = false }, { token = "agent", bold = false, dim = false }],
  ["state_text", { token = "workspace", dim = true, rules = [
    { starts_with = "└ ", hide = true },
  ] }, { token = "$short", dim = true }, { token = "machine", dim = true }],
]

# Hierarchy by weight only (no hardcoded colors, so any theme works): top-level
# bold; firstmate's "└ task · p:<token>" children show $short ("└ task", from
# plugins/local/fm-short-label) so the token doesn't eat the width.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true, rules = [
    { starts_with = "└ ", hide = true },
  ] }, "$short"],
  ["branch", "git_status"],
]

# ── Notifications ─────────────────────────────────────────────────────

[ui.toast]
delivery = "herdr"

# ── Keybindings ───────────────────────────────────────────────────────

[keys]
prefix = "ctrl+a"

# Panes
split_vertical = "prefix+="

# Agents
previous_agent = "prefix+up"
next_agent = "prefix+down"

# Tabs & workspaces
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
