onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────

[theme]
name = "tokyo-night"
auto_switch = false

# Keep separators visible through the terminal palette, without pinning an RGB color.
[theme.custom]
surface_dim = "darkgray"

# ── UI ────────────────────────────────────────────────────────────────

[ui]
# Sidebar
sidebar_width = 32
sidebar_min_width = 20
sidebar_max_width = 38
sidebar_collapsed_mode = "compact"

# Tabs & window
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
window_title = "{hostname} · {workspace} · {tab}"

# Panes
pane_borders = "auto"
pane_gaps = true
pane_outer_borders = true
show_agent_labels_on_pane_borders = true

# Agents
agent_panel_sort = "spaces"
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 0
# Three rows: task title; status and agent; machine and project.
# Herdr 0.9.3 rules cannot rewrite text; separators remain the native " · ".
# Harness, machine, and project names are bold and dim; colors follow the theme.
# Native token foregrounds can differ; do not override them with fixed RGB.
rows = [
  ["state_icon", { token = "$sidebar_title", fg = "#ffffff", bold = true, dim = false }],
  ["state_text", { token = "agent", bold = true, dim = true }],
  [{ token = "machine", bold = true, dim = true }, { token = "workspace", bold = true, dim = true, rules = [
    { starts_with = "└ ", hide = true },
  ] }, { token = "$short", bold = true, dim = true }],
]

# Top-level and Firstmate child names are bold, with theme-native colors.
# Firstmate's "└ task · p:<token>" children show $short ("└ task", from
# plugins/local/fm-short-label) so the token doesn't eat the width.
# $short retains Herdr's custom-token color; it cannot inherit workspace color.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true, rules = [
    { starts_with = "└ ", hide = true },
  ] }, { token = "$short", bold = true }],
  ["branch", "git_status"],
]

# ── Notifications ─────────────────────────────────────────────────────

[ui.toast]
delivery = "herdr"

# ── Keybindings ───────────────────────────────────────────────────────

[keys]
prefix = "ctrl+a"

# Panes
split_vertical = "prefix+="

# Agents
previous_agent = "prefix+up"
next_agent = "prefix+down"

# Tabs & workspaces
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
