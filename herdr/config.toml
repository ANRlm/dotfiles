onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────

[theme]
name = "rose-pine"

# Every fixed color in this file comes from the Rose Pine palette (Herdr's
# rose-pine slots in src/app/state.rs, or Rose Pine's own names). When switching
# theme, replace these values:
#   text           #e0def4   task titles
#   subtext0       #c8c5dc   Firstmate $short, matching unfocused workspace names
#   overlay1       #908caa   agent names (Rose Pine "subtle")
#   teal           #9ccfd8   remote machine names (Rose Pine "foam"; blue/pine is too dark)
#   rose           #ebbcba   $worktree repo names (Rose Pine "rose")
#   gold           #f6c177   $worktree_status ahead/behind and uncommitted counts (Rose Pine "gold")
#   highlight_med  #403d52   separators (surface_dim)

# rose-pine's surface_dim (#26233a) barely differs from the panel background.
[theme.custom]
surface_dim = "#403d52"

# ── Updates ───────────────────────────────────────────────────────────

# Homebrew handles upgrades; the in-app check keeps failing to fetch.
[update]
version_check = false

# ── UI ────────────────────────────────────────────────────────────────

[ui]
# Sidebar
sidebar_width = 32
sidebar_min_width = 20
sidebar_max_width = 38

# Tabs & window
prompt_new_tab_name = false
window_title = "{hostname} · {workspace} · {tab}"

# Panes
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
# Three rows: task title; machine and project; agent (the state icon shows status).
# Herdr 0.9.3 rules cannot rewrite text; separators remain the native " · ".
# Harness, machine, and project names are bold (no dim).
# "Local" is hidden: fewer native " · " separators, and remote hosts stand out.
# Machine, agent, and custom tokens default to overlay0, shared with headers and
# borders, so they take palette colors listed under [theme]. An fg also drops
# Herdr's focused-row variant, so workspace keeps its native text/subtext0.
rows = [
  ["state_icon", { token = "$sidebar_title", fg = "#e0def4", bold = true }],
  [{ token = "machine", fg = "#9ccfd8", bold = true, rules = [
    { equals = "Local", hide = true },
  ] }, { token = "workspace", bold = true, rules = [
    { starts_with = "└ ", hide = true },
  ] }, { token = "$short", fg = "#c8c5dc", bold = true }],
  [{ token = "agent", fg = "#908caa", bold = true }],
]

# Top-level and Firstmate child names are bold, with theme-native colors.
# Firstmate's "└ task · p:<token>" children show $short ("└ task", from
# plugins/local/fm-short-label) so the token doesn't eat the width.
# $short takes subtext0, the unfocused workspace color (custom tokens default to overlay1).
# branch and git_status follow the shell's cwd (a Firstmate task's main clone), so the agent's
# linked worktree ($worktree and $worktree_status, from plugins/local/worktree-label) leads the row.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true, rules = [
    { starts_with = "└ ", hide = true },
  ] }, { token = "$short", fg = "#c8c5dc", bold = true }],
  [{ token = "$worktree", fg = "#ebbcba" }, { token = "$worktree_status", fg = "#f6c177" },
   "branch", "git_status"],
]

# ── Notifications ─────────────────────────────────────────────────────

[ui.toast]
delivery = "herdr"

# ── Keybindings ───────────────────────────────────────────────────────

[keys]
prefix = "ctrl+a"

# Panes
split_vertical = "prefix+="

# Agents
previous_agent = "prefix+up"
next_agent = "prefix+down"

# Workspaces
switch_workspace = "prefix+shift+1..9"

[keys.indexed]
# alt+1..9 focuses sidebar agent rows; Ghostty sends Option as Alt.
agents = "alt"
