onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────

[theme]
name = "rose-pine"

# rose-pine's surface_dim (#26233a) barely differs from the panel background.
[theme.custom]
surface_dim = "#403d52"

# ── Updates ───────────────────────────────────────────────────────────

# Homebrew handles upgrades; the in-app check keeps failing to fetch.
[update]
version_check = false

# ── UI ────────────────────────────────────────────────────────────────

[ui]
# Sidebar
sidebar_width = 32
sidebar_min_width = 20
sidebar_max_width = 38

# Tabs & window
prompt_new_tab_name = false
window_title = "{hostname} · {workspace} · {tab}"

# Panes
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
# Herdr's default two rows, with the live terminal title as the task name on top.
# "Local" is hidden so remote hosts stand out; Rose Pine foam (#9ccfd8) marks them.
# Firstmate's "└ task · p:<token>" children show $short (plugins/local/fm-short-label) instead.
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  [{ token = "machine", fg = "#9ccfd8", rules = [{ equals = "Local", hide = true }] },
   { token = "workspace", rules = [{ starts_with = "└ ", hide = true }] }, "$short", "agent"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true, rules = [{ starts_with = "└ ", hide = true }] },
   { token = "$short", bold = true }],
  ["branch", "git_status"],
]

# ── Notifications ─────────────────────────────────────────────────────

[ui.toast]
delivery = "herdr"

# ── Keybindings ───────────────────────────────────────────────────────

[keys]
prefix = "ctrl+a"

# Panes
split_vertical = "prefix+="

# Agents
previous_agent = "prefix+up"
next_agent = "prefix+down"

# Workspaces
switch_workspace = "prefix+shift+1..9"

[keys.indexed]
# alt+1..9 focuses sidebar agent rows; Ghostty sends Option as Alt.
agents = "alt"
