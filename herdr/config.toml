# ── Onboarding ────────────────────────────────────────────────────────

onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────

[theme]
name = "terminal"
auto_switch = false

# ── Interface & Notifications ─────────────────────────────────────────

[ui]
status_indicators = "dots"
show_agent_labels_on_pane_borders = false

[ui.toast]
delivery = "herdr"

# ── Keybindings ───────────────────────────────────────────────────────

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+="
