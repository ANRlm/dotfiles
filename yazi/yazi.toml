# ── File Manager ──────────────────────────────────────────────────────

[mgr]
ratio = [2, 2, 3]
show_hidden = true
mouse_events = ["click", "scroll"]

# ── Preview ──────────────────────────────────────────────────────────

[preview]
max_width = 2048
max_height = 2048
image_quality = 85

[[plugin.prepend_previewers]]
url = "*.tar*"
run = 'piper --format=url -- tar tf "$1"'

[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- bat -p --color=always "$1"'

[[plugin.prepend_previewers]]
mime = "application/sqlite3"
run = 'piper -- sqlite3 "$1" ".schema --indent"'

# ── Git ───────────────────────────────────────────────────────────────

[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "git"
