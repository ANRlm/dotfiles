# --------------------------------------------------
# Plugins
# --------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_with_mouse off
# --------------------------------------------------
# General
# --------------------------------------------------
setw -g monitor-bell off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g extended-keys on
# --------------------------------------------------
# Terminal / Colors
# --------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:clipboard"
set -as terminal-features ",*:usstyle"
set -as terminal-features "xterm*:extkeys"
# --------------------------------------------------
# Prefix
# --------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# --------------------------------------------------
# Key bindings
# --------------------------------------------------
# reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
# split panes / new window, inheriting the current path
unbind %
unbind '"'
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
# select panes (repeatable)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
# resize panes (repeatable via custom key table)
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize q      switch-client -T root
bind -T resize Escape switch-client -T root
# --------------------------------------------------
# Copy mode (vi keys)
# --------------------------------------------------
# y / Y / M-y are bound by tmux-yank and copy to the system clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# --------------------------------------------------
# Yazi passthrough
# --------------------------------------------------
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# --------------------------------------------------
# TPM
# --------------------------------------------------
if "test ! -d ~/.config/tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
